services:
  db:
    image: postgres:16
    env_file: [.env]
    container_name: shopstore-db
    restart: always
    # Хост: Alembic/Makefile (localhost:5433). Только loopback, не 0.0.0.0.
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopstore-redis
    restart: always
    # Loopback only — для MCP/redis-cli с хоста. На prod порт не открываем.
    ports:
      - "127.0.0.1:6381:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: shopstore-api
    env_file: [.env]
    environment:
      ADMIN_PANEL_LOGIN: ${ADMIN_PANEL_LOGIN:-}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      HTTP_PROXY: ${TG_BOT_PROXY:-}
      HTTPS_PROXY: ${TG_BOT_PROXY:-}
      NO_PROXY: redis,db,localhost,127.0.0.1
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    volumes:
      - media:/app/media
      # Локально: правки в src (шаблоны, статика, код) без пересборки образа
      - ./src:/app/src
      - ./alembic:/app/alembic
      # Сборка витрины на хосте: make storefront-build
      - ./frontend/dist:/app/frontend/dist:ro

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: shopstore-bot
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run python -m src.bot.main"
    depends_on:
      api:
        condition: service_started
    # Как у api: код с хоста, без пересборки образа после правок в src.
    volumes:
      - ./src:/app/src

  worker-import:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      HTTP_PROXY: ${TG_BOT_PROXY:-}
      HTTPS_PROXY: ${TG_BOT_PROXY:-}
      NO_PROXY: redis,db,libretranslate,localhost,127.0.0.1
      SCRAPER_LIBRETRANSLATE_URL: http://libretranslate:5000
    command: sh -c "uv run rq worker catalog_import"
    depends_on:
      - redis
      - db
    volumes:
      - media:/app/media

  worker-dom-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: scraper
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SCRAPER_HEADLESS: "true"
      SCRAPER_LIBRETRANSLATE_URL: http://libretranslate:5000
      SCRAPER_LANE_ID: "1"
      SCRAPER_STORAGE_STATE_PATH: /app/src/scraper/infrastructure/session-1/storage_state.json
      SCRAPER_PROXY_SERVER: ${LANE_1_PROXY_SERVER:-}
      SCRAPER_PROXY_USERNAME: ${LANE_1_PROXY_USERNAME:-}
      SCRAPER_PROXY_PASSWORD: ${LANE_1_PROXY_PASSWORD:-}
    command: sh -c "uv run rq worker catalog_dom"
    depends_on:
      - redis
      - db
    volumes:
      - media:/app/media
      - ./src:/app/src
      - ./src/scraper/.playwright_profile:/app/src/scraper/.playwright_profile
      - ./src/scraper/infrastructure/session-1:/app/src/scraper/infrastructure/session-1
      - ./src/scraper/.env:/app/src/scraper/.env:ro

  worker-dom-2:
    profiles: [dom-lane-2]
    build:
      context: .
      dockerfile: Dockerfile
      target: scraper
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SCRAPER_HEADLESS: "true"
      SCRAPER_LIBRETRANSLATE_URL: http://libretranslate:5000
      SCRAPER_LANE_ID: "2"
      SCRAPER_STORAGE_STATE_PATH: /app/src/scraper/infrastructure/session-2/storage_state.json
      SCRAPER_PROXY_SERVER: ${LANE_2_PROXY_SERVER:-}
      SCRAPER_PROXY_USERNAME: ${LANE_2_PROXY_USERNAME:-}
      SCRAPER_PROXY_PASSWORD: ${LANE_2_PROXY_PASSWORD:-}
    command: sh -c "uv run rq worker catalog_dom"
    depends_on:
      - redis
      - db
    volumes:
      - media:/app/media
      - ./src:/app/src
      - ./src/scraper/.playwright_profile-lane2:/app/src/scraper/.playwright_profile
      - ./src/scraper/infrastructure/session-2:/app/src/scraper/infrastructure/session-2
      - ./src/scraper/.env:/app/src/scraper/.env:ro

  worker-finalize:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run rq worker catalog_finalize"
    depends_on:
      - redis
      - db

  worker-translation:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      HTTP_PROXY: ${TG_BOT_PROXY:-}
      HTTPS_PROXY: ${TG_BOT_PROXY:-}
      NO_PROXY: redis,db,libretranslate,localhost,127.0.0.1
      SCRAPER_LIBRETRANSLATE_URL: http://libretranslate:5000
    command: sh -c "uv run rq worker translation"
    depends_on:
      - redis
      - db
      - libretranslate
    volumes:
      - ./src:/app/src

  worker-pricing:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run rq worker pricing"
    depends_on:
      - redis
      - db

  worker-tracking:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      HTTP_PROXY: ${TG_BOT_PROXY:-}
      HTTPS_PROXY: ${TG_BOT_PROXY:-}
      NO_PROXY: redis,db,localhost,127.0.0.1
    command: sh -c "uv run rq worker supplier_tracking delivered_alert_retry"
    depends_on:
      - redis
      - db

  worker-dhl:
    build:
      context: .
      dockerfile: Dockerfile
      target: scraper
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SCRAPER_HEADLESS: "true"
    command: sh -c "uv run rq worker dhl_browser_tracking"
    depends_on:
      - redis
      - db

  worker-availability:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      HTTP_PROXY: ${TG_BOT_PROXY:-}
      HTTPS_PROXY: ${TG_BOT_PROXY:-}
      NO_PROXY: redis,db,localhost,127.0.0.1
    command: sh -c "uv run rq worker supplier_availability"
    depends_on:
      - redis
      - db
    volumes:
      - ./src:/app/src
      - ./src/scraper/infrastructure/session:/app/src/scraper/infrastructure/session:ro

  scraper:
    profiles: [scraper]
    build:
      context: .
      dockerfile: Dockerfile
      target: scraper
    container_name: shopstore-scraper
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      # В контейнере нет X11: headed + channel=chrome падает. Локально в .env можно оставить false.
      SCRAPER_HEADLESS: "true"
    command: sh -c "uv run python -m src.scraper.app --once"
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
      - ./src/scraper/infrastructure/session:/app/src/scraper/infrastructure/session
      - ./src/scraper/.env:/app/src/scraper/.env:ro

  # Argos en↔ru fallback. Хост 15000: на macOS :5000 часто занят AirPlay.
  libretranslate:
    image: libretranslate/libretranslate:v1.8.4
    container_name: shopstore-libretranslate
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,ru
      LT_CHAR_LIMIT: "5000"
      LT_THREADS: "2"
      LT_DISABLE_WEB_UI: "true"
    ports:
      - "127.0.0.1:15000:5000"
    volumes:
      - lt_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 120s


  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    container_name: shopstore-seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[{"name":"shopstore","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -filer -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-shopstore}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-shopstore-dev-secret-change-me}
    volumes:
      - seaweedfs_data:/data
    expose:
      - "8333"
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -S -O /dev/null http://127.0.0.1:8333 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  db:
  media:
  lt_models:
  seaweedfs_data:
