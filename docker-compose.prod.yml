x-api-build: &api-build
  context: .
  dockerfile: Dockerfile
  target: runtime
  args:
    VITE_TG_BOT_USERNAME: ${TG_BOT_USERNAME}

x-api-image: &api-image
  image: shopstore-api
  build: *api-build

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0

x-api-service: &api-service
  <<: *api-image
  restart: always
  env_file: [.env]
  environment: *api-env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media:/app/media
    - ./src/scraper/infrastructure/session:/app/src/scraper/infrastructure/session
    - ./src/scraper/infrastructure/session-1:/app/src/scraper/infrastructure/session-1:ro
    - ./src/scraper/infrastructure/session-2:/app/src/scraper/infrastructure/session-2:ro
    - ./src/scraper/.env:/app/src/scraper/.env:ro
  stop_grace_period: 30s
  command: >-
    sh -c "uv run uvicorn src.main:app --host 0.0.0.0 --port 8000
    --workers 4 --timeout-graceful-shutdown 25"
  healthcheck:
    test:
      [
        "CMD-SHELL",
        'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/ready\", timeout=5)"',
      ]
    interval: 15s
    timeout: 6s
    retries: 5
    start_period: 120s

services:
  db:
    image: postgres:16
    env_file: [.env]
    container_name: shopstore-db
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopstore-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-blue:
    <<: *api-service
    ports:
      - "127.0.0.1:8001:8000"

  api-green:
    <<: *api-service
    profiles: [api-standby]
    ports:
      - "127.0.0.1:8002:8000"

  api-migrate:
    profiles: [migrate]
    <<: *api-image
    env_file: [.env]
    environment: *api-env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: uv run alembic upgrade head

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: shopstore-bot
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run python -m src.bot.main"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, psycopg2; c=psycopg2.connect(host=os.environ['POSTGRES_HOST'],port=int(os.environ['POSTGRES_PORT']),user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],dbname=os.environ['POSTGRES_DB'],connect_timeout=3); c.close()\"",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

  worker-import:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SCRAPER_LIBRETRANSLATE_URL: http://libretranslate:5000
    command: sh -c "uv run rq worker catalog_import"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - ./src/scraper/infrastructure/session:/app/src/scraper/infrastructure/session

  worker-dom-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: scraper
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SCRAPER_HEADLESS: "true"
      SCRAPER_LIBRETRANSLATE_URL: http://libretranslate:5000
      SCRAPER_LANE_ID: "1"
      SCRAPER_STORAGE_STATE_PATH: /app/src/scraper/infrastructure/session-1/storage_state.json
      SCRAPER_PROXY_SERVER: ${LANE_1_PROXY_SERVER:-}
      SCRAPER_PROXY_USERNAME: ${LANE_1_PROXY_USERNAME:-}
      SCRAPER_PROXY_PASSWORD: ${LANE_1_PROXY_PASSWORD:-}
    command: sh -c "uv run rq worker catalog_dom"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - ./src/scraper/.playwright_profile:/app/src/scraper/.playwright_profile
      - ./src/scraper/infrastructure/session-1:/app/src/scraper/infrastructure/session-1
      - ./src/scraper/.env:/app/src/scraper/.env:ro

  worker-dom-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: scraper
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SCRAPER_HEADLESS: "true"
      SCRAPER_LIBRETRANSLATE_URL: http://libretranslate:5000
      SCRAPER_LANE_ID: "2"
      SCRAPER_STORAGE_STATE_PATH: /app/src/scraper/infrastructure/session-2/storage_state.json
      SCRAPER_PROXY_SERVER: ${LANE_2_PROXY_SERVER:-}
      SCRAPER_PROXY_USERNAME: ${LANE_2_PROXY_USERNAME:-}
      SCRAPER_PROXY_PASSWORD: ${LANE_2_PROXY_PASSWORD:-}
    command: sh -c "uv run rq worker catalog_dom"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - ./src/scraper/.playwright_profile-lane2:/app/src/scraper/.playwright_profile
      - ./src/scraper/infrastructure/session-2:/app/src/scraper/infrastructure/session-2
      - ./src/scraper/.env:/app/src/scraper/.env:ro

  worker-translation:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SCRAPER_LIBRETRANSLATE_URL: http://libretranslate:5000
    command: sh -c "uv run rq worker translation"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      libretranslate:
        condition: service_healthy

  worker-finalize:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run rq worker catalog_finalize"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import os,redis; redis.from_url(os.environ[\"REDIS_URL\"]).ping()"',
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker-pricing:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run rq worker pricing"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-tracking:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run rq worker supplier_tracking delivered_alert_retry"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-dhl:
    build:
      context: .
      dockerfile: Dockerfile
      target: scraper
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SCRAPER_HEADLESS: "true"
    command: sh -c "uv run rq worker dhl_browser_tracking"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-availability:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: always
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    command: sh -c "uv run rq worker supplier_availability"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./src/scraper/infrastructure/session:/app/src/scraper/infrastructure/session:ro

  scraper:
    profiles: [scraper]
    build:
      context: .
      dockerfile: Dockerfile
      target: scraper
    container_name: shopstore-scraper
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      SCRAPER_HEADLESS: "true"
    command: sh -c "uv run python -m src.scraper.app --once"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src/scraper/.playwright_profile:/app/src/scraper/.playwright_profile
      - ./src/scraper/infrastructure/session:/app/src/scraper/infrastructure/session
      - ./src/scraper/.env:/app/src/scraper/.env:ro

  # Argos en↔ru fallback. Порт на хост не публикуем.
  libretranslate:
    image: libretranslate/libretranslate:v1.8.4
    container_name: shopstore-libretranslate
    restart: always
    environment:
      LT_LOAD_ONLY: en,ru
      LT_CHAR_LIMIT: "5000"
      LT_THREADS: "2"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - lt_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 120s

  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    container_name: shopstore-seaweedfs
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[{"name":"shopstore","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -filer -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:8888:8888"
    expose:
      - "8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -S -O /dev/null http://127.0.0.1:8333 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db:
  media:
  lt_models:
  seaweedfs_data:
